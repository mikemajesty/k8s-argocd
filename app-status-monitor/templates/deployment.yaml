apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-status-monitor.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app-status-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "app-status-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-status-monitor.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app-status-monitor.fullname" . }}
      containers:
      - name: monitor
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/monitor
        env:
        - name: CONFIG_PATH
          value: "/etc/monitor/config.yaml"
        - name: LOG_LEVEL
          value: "info"
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "app-status-monitor.fullname" . }}-config