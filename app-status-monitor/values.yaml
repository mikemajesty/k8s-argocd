# values.yaml (completo com todas as envs)
replicaCount: 1

image:
  repository: mikelima1989/app-status-monitor
  tag: "1.0.11"
  pullPolicy: Always

namespace: argocd

service:
  type: ClusterIP
  port: 8080

# 📊 Configurações de Log
logLevel: "info"
logFormat: "json"  # "json" ou "text"

# ⚡️ Configurações de Performance
performance:
  maxWorkers: "10"              # Máximo de goroutines simultâneas
  httpClientTimeout: "30s"      # Timeout para requests HTTP
  watchReconnectInterval: "5s"  # Intervalo para reconectar watch

# 🕐 Timeouts Padrão (para quando não especificado no request)
timeouts:
  kafka: "20m"      # Kafka Topics
  deployment: "10m" # Deployments Kubernetes
  database: "25m"   # PostgreSQL/MySQL
  redis: "15m"      # Redis Clusters

# 🔍 Check Intervals (para fallback de polling)
checkIntervals:
  kafka: "30s"      # Intervalo para Kafka
  deployment: "15s" # Intervalo para Deployments  
  database: "45s"   # Intervalo para Databases
  redis: "30s"      # Intervalo para Redis
  default: "20s"    # Intervalo padrão

# 🔐 Configurações de Segurança
security:
  enableMetrics: "true"     # Expõe métricas Prometheus
  allowedOrigins: "*"       # CORS allowed origins

config:
  watchInterval: 30s

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Configurações de rede
networkPolicy:
  enabled: false
  allowedNamespaces: []
  allowedIPs: []

# Configurações de ingress (opcional)
ingress:
  enabled: true
  host: status-monitor.127.0.0.1.nip.io  # ⬅️ Seu domínio aqui
  ingressClassName: nginx  # ⬅️ Ajuste conforme seu ingress controller
  
  # Annotations comuns
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    
  # TLS/SSL (opcional)
  tls: []


# Configurações de autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80